[workspace]
resolver = "3"
members = ["crates/core", "crates/storage", "crates/service"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Deliberately no `panic = "abort"`: the engine runs each execution in its own
# tokio task, so a panic there must not take the whole service down.
