[package]
name = "scriptrunner-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
scriptrunner-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7.20", features = ["codec"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Services",
] }

[dev-dependencies]
tempfile = "3.27.0"
