[package]
name = "scriptrunner-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
# eframe 0.37 needs Rust 1.95, newer than the workspace minimum. The toolchain is pinned
# (rust-toolchain.toml), so this only matters to someone building with an older compiler.
rust-version = "1.95"
description = "ScriptRunner graphical front end (egui). Talks to the daemon over IPC; has no SQLite."

[lib]
name = "scriptrunner_gui"
path = "src/lib.rs"

# The real application. Its Windows build asks for elevation (see build.rs).
[[bin]]
name = "scriptrunner-gui"
path = "src/main.rs"

[dependencies]
# wgpu only (plan D14). The spike on a Windows machine with no GPU showed wgpu opening through DX12's
# software adapter ("Microsoft Basic Render Driver"), while glow failed there ("requires opengl 2.0+").
# Do not add the glow feature back: a scheduler's GUI is often opened over RDP or on a server VM.
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# The editor's "choose a file" dialogs (3.6). It blocks, so the editor runs it on a thread of its own.
rfd = "0.18.0"
scriptrunner-core = { version = "0.1.0", path = "../core" }
scriptrunner-ipc = { version = "0.1.0", path = "../ipc" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }

[dev-dependencies]
# The backend tests run against a real engine behind a real IPC server. The service (and, through
# it, SQLite) is therefore a *test* dependency only: `cargo tree -p scriptrunner-gui -e normal,build`
# must stay free of rusqlite.
scriptrunner-service = { version = "0.1.0", path = "../service" }
scriptrunner-storage = { version = "0.1.0", path = "../storage" }
tempfile = "3.27.0"
tokio-util = "0.7.20"
