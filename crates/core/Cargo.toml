[package]
name = "scriptrunner-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
cron = "0.17.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
chrono-tz = "0.10.4"
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
